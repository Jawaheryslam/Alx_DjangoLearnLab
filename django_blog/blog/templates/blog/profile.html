{% extends 'blog/base.html' %}
{% block title %}Profile{% endblock %}
{% block content %}
	<h2>Your Profile</h2>
        <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
		<h3>Account</h3>
                {{ uform.as_p }}

		<h3>Profile</h3>
		{% if user.profile.avatar %}
			<img src="{{ user.profile.avatar.url }}" alt="avatar" style="max-width:120px;" />
		{% endif %}
		{{ pform.as_p }}

                <button type="submit">Save</button>
        </form>
{% endblock %}
